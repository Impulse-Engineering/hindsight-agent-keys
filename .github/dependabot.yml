version: 2
updates:
  # Dependabot does not track the upstream Hindsight image. The upstream-release
  # workflow proposes upstream's latest release as a PR that bumps the pinned FROM line.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The hash-pinned integration-test runner (requirements-ci.txt).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
