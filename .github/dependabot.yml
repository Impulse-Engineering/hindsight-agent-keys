version: 2
updates:
  # Dependabot does not track the upstream Hindsight image. The upstream-release
  # workflow proposes upstream's latest release as a PR that bumps the pinned FROM line.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The hash-pinned CI runner (requirements-ci.txt): tests, Python lint and the doc shell parsers.
  # uv, not pip: the uv updater recompiles requirements-ci.in, reading its options (hashes, --python-version)
  # from requirements-ci.txt; the pip updater failed on every run against this uv-compiled file.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
