version: 2
updates:
  # Dependabot does not track the upstream Hindsight image. The upstream-release
  # workflow proposes upstream's latest release as a PR that bumps the pinned FROM line.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The hash-pinned CI runner (requirements-ci.txt): tests, Python lint, the doc shell parsers and the pin check.
  # uv, not pip: the uv updater recompiles requirements-ci.in with uv, reading its options (hashes, --python-version)
  # from requirements-ci.txt, so transitive pins move with each bump. The pip updater would compile a .in with pip-tools.
  - package-ecosystem: uv
    directory: /
    # The updater reads every first-level directory's requirements files. docker/'s pins override upstream's
    # vulnerable packages until the pinned release meets them (docs/operating.md, "Pinning a package over upstream"),
    # so they are not bumped here.
    exclude-paths:
      - docker/**
    schedule:
      interval: weekly
