name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Daily scan of main, so an advisory published after the last merge shows before a PR or a deploy meets it.
  schedule:
    - cron: "23 7 * * *"

# Every job starts read-only; only publish (packages) and scan-alert (issues) widen their tokens.
permissions:
  contents: read

# Per event: a queued scheduled run must never replace a queued push run on main, which publishes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: hindsight-agent-keys:test
  UI_IMAGE: hindsight-ui:test
  REPOSITORY: ghcr.io/impulse-engineering/hindsight-agent-keys
  UI_REPOSITORY: ghcr.io/impulse-engineering/hindsight-ui
  # Grype runs as a digest-pinned container: no third-party action code.
  GRYPE: anchore/grype@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe # v0.120.1

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the CI runner (pytest, ruff, markdown-it-py, shfmt)
        run: |
          python3 -m venv /tmp/it
          /tmp/it/bin/pip install --quiet --require-hashes --no-deps -r requirements-ci.txt

      - name: Lint (ruff, shellcheck, actionlint)
        run: PATH="/tmp/it/bin:$PATH" scripts/lint.sh

      - name: Script tests (release watcher, scan alert, doc shell checks, pins, no real hosts)
        run: PATH="/tmp/it/bin:$PATH" pytest -p no:cacheprovider -c /dev/null --rootdir . tests/scripts -v

      - name: Build the images (API, then UI from the same pinned base)
        run: docker build -t "$IMAGE" . && docker build --target ui -t "$UI_IMAGE" .

      # In the built image, so the tests see its pinned packages, not only upstream's.
      - name: Unit tests (inside the built image)
        run: UNIT_TEST_IMAGE="$IMAGE" scripts/unit-tests.sh -v

      - name: Integration tests (real container, mock LLM)
        run: /tmp/it/bin/pytest -p no:cacheprovider -c /dev/null --rootdir . tests/integration -v

  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the images (API, then UI from the same pinned base)
        run: |
          docker build -t "$IMAGE" .
          docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
          docker build --target ui -t "$UI_IMAGE" .
          docker save "$UI_IMAGE" -o "$RUNNER_TEMP/ui-image.tar"

      # Scans each exported tar: no Docker socket, read-only token.
      # Blocks on critical vulnerabilities that have a fix; reports the rest.
      - name: Vulnerability scan of both images (Grype)
        run: |
          for tar in image.tar ui-image.tar; do
            docker run --rm -v "$RUNNER_TEMP/$tar:/scan/image.tar:ro" "$GRYPE" \
              docker-archive:/scan/image.tar --only-fixed --fail-on critical -o table
          done

  # A scheduled scan of main that does not pass (failed, cancelled or timed out) files an
  # issue here (scripts/scan-alert.sh), so the break is seen before a PR meets it.
  scan-alert:
    if: always() && github.event_name == 'schedule' && needs.scan.result != 'success'
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: File the failed scan as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/scan-alert.sh "$RUN_URL"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      ui_digest: ${{ steps.build-ui.outputs.digest }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # <upstream version>-ak.<run>, plus .<attempt> on a re-run, so a published
      # tag is never moved to a different digest.
      - name: Tag from the pinned upstream version
        id: tag
        run: |
          ref=$(scripts/upstream-ref.sh)
          version=${ref#*:}
          version=${version%%@*}
          tag="${version}-ak.${GITHUB_RUN_NUMBER}"
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then tag="${tag}.${GITHUB_RUN_ATTEMPT}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c # v0.34.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64, SBOM, provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPOSITORY }}:${{ steps.tag.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The UI image: the same pinned base and tag, under its own package.
      - name: Build and push the UI image (amd64, SBOM, provenance)
        id: build-ui
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ui
          platforms: linux/amd64
          push: true
          tags: ${{ env.UI_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Attest the UI image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.UI_REPOSITORY }}
          subject-digest: ${{ steps.build-ui.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign both images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          UI_DIGEST: ${{ steps.build-ui.outputs.digest }}
        run: |
          cosign sign --yes "${REPOSITORY}@${DIGEST}"
          cosign sign --yes "${UI_REPOSITORY}@${UI_DIGEST}"

  # The published digests are fresh builds, so test and scan exactly those digests
  # before anyone approves them. Read-only token plus package read.
  verify-published:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      UI_DIGEST: ${{ needs.publish.outputs.ui_digest }}
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published digests
        run: |
          docker pull "${REPOSITORY}@${DIGEST}"
          docker tag "${REPOSITORY}@${DIGEST}" hindsight-agent-keys:published
          docker save hindsight-agent-keys:published -o "$RUNNER_TEMP/image.tar"
          docker pull "${UI_REPOSITORY}@${UI_DIGEST}"
          docker tag "${UI_REPOSITORY}@${UI_DIGEST}" hindsight-ui:published
          docker save hindsight-ui:published -o "$RUNNER_TEMP/ui-image.tar"

      - name: Install the integration-test runner
        run: |
          python3 -m venv /tmp/it
          /tmp/it/bin/pip install --quiet --require-hashes --no-deps -r requirements-ci.txt

      - name: Integration tests against the published digests
        run: |
          IMAGE="${REPOSITORY}@${DIGEST}" UI_IMAGE="${UI_REPOSITORY}@${UI_DIGEST}" \
            /tmp/it/bin/pytest -p no:cacheprovider -c /dev/null --rootdir . tests/integration -v

      - name: Vulnerability scan of the published digests (Grype)
        run: |
          for tar in image.tar ui-image.tar; do
            docker run --rm -v "$RUNNER_TEMP/$tar:/scan/image.tar:ro" "$GRYPE" \
              docker-archive:/scan/image.tar --only-fixed --fail-on critical -o table
          done

      - name: Summary
        run: |
          {
            echo "### Published and verified"
            echo "- API: \`${REPOSITORY}:${TAG}\`, digest \`${DIGEST}\`"
            echo "- UI: \`${UI_REPOSITORY}:${TAG}\`, digest \`${UI_DIGEST}\`"
            echo "- Integration tests and the vulnerability scan passed on these exact digests."
            echo "- Approve a digest in the deployment platform before deploying it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Published and verified::${REPOSITORY}:${TAG} ${DIGEST}"
          echo "::notice title=Published and verified::${UI_REPOSITORY}:${TAG} ${UI_DIGEST}"
