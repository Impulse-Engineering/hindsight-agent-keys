name: ci

on:
  pull_request:
  push:
    branches: [main]

# Every job starts read-only; only publish widens its token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: hindsight-agent-keys:test
  REPOSITORY: ghcr.io/impulse-engineering/hindsight-agent-keys
  # Grype runs as a digest-pinned container: no third-party action code.
  GRYPE: anchore/grype@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe # v0.120.1

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests (inside the pinned upstream image)
        run: scripts/unit-tests.sh -v

      - name: Build the image
        run: docker build -t "$IMAGE" .

      - name: Install the integration-test runner
        run: |
          python3 -m venv /tmp/it
          /tmp/it/bin/pip install --quiet --require-hashes --no-deps -r requirements-ci.txt

      - name: Integration tests (real container, mock LLM)
        run: /tmp/it/bin/pytest -p no:cacheprovider -c /dev/null --rootdir . tests/integration -v

  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t "$IMAGE" . && docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"

      # Scans an exported tar: no Docker socket, read-only token.
      # Blocks on critical vulnerabilities that have a fix; reports the rest.
      - name: Vulnerability scan (Grype)
        run: |
          docker run --rm -v "$RUNNER_TEMP/image.tar:/scan/image.tar:ro" "$GRYPE" \
            docker-archive:/scan/image.tar --only-fixed --fail-on critical -o table

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # <upstream version>-ak.<run>, plus .<attempt> on a re-run, so a published
      # tag is never moved to a different digest.
      - name: Tag from the pinned upstream version
        id: tag
        run: |
          ref=$(scripts/upstream-ref.sh)
          version=${ref#*:}
          version=${version%%@*}
          tag="${version}-ak.${GITHUB_RUN_NUMBER}"
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then tag="${tag}.${GITHUB_RUN_ATTEMPT}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c # v0.34.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64, SBOM, provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPOSITORY }}:${{ steps.tag.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REPOSITORY}@${DIGEST}"

  # The published digest is a fresh build, so test and scan exactly that digest
  # before anyone approves it. Read-only token plus package read.
  verify-published:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published digest
        run: |
          docker pull "${REPOSITORY}@${DIGEST}"
          docker tag "${REPOSITORY}@${DIGEST}" hindsight-agent-keys:published
          docker save hindsight-agent-keys:published -o "$RUNNER_TEMP/image.tar"

      - name: Install the integration-test runner
        run: |
          python3 -m venv /tmp/it
          /tmp/it/bin/pip install --quiet --require-hashes --no-deps -r requirements-ci.txt

      - name: Integration tests against the published digest
        run: IMAGE="${REPOSITORY}@${DIGEST}" /tmp/it/bin/pytest -p no:cacheprovider -c /dev/null --rootdir . tests/integration -v

      - name: Vulnerability scan of the published digest (Grype)
        run: |
          docker run --rm -v "$RUNNER_TEMP/image.tar:/scan/image.tar:ro" "$GRYPE" \
            docker-archive:/scan/image.tar --only-fixed --fail-on critical -o table

      - name: Summary
        run: |
          {
            echo "### Published and verified"
            echo "- Tag: \`${REPOSITORY}:${TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Integration tests and the vulnerability scan passed on this exact digest."
            echo "- Approve this digest in the deployment platform before deploying it."
          } >> "$GITHUB_STEP_SUMMARY"
